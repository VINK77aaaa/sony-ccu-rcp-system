schema_version: 1
bundle_id: bundle.sony-ccu-rcp-system
book:
  title: Sony 摄像机控制系统使用说明书合辑（RCP-3500/3501 遥控面板 + HDCU5000/5500/3500 摄像机控制单元）
  author: Sony Corporation
  source_pack: sony-rcp-3500-3501-manual-2019 + sony-hdcu-5000-5500-3500-manual-2019
  baseline_tag: cangjie-v2.5.0
entry:
  name: sony-ccu-rcp-system
  description: 'Sony 摄像机控制系统（RCP-3500/3501 遥控面板 + HDCU5000/5500/3500 摄像机控制单元）的统一技能入口，蒸馏自 Sony 2019 两本官方使用说明书。覆盖 31 项能力：RCP 侧 13 项（组网连接、MCS 多机仲裁、面板灯语诊断、摄像机日常操作、工程师模式与安全代码、白黑闪光平衡、场景文件、USB 备份、自定义、Paint 图像调整、维护校正、规格速查、环境红线）+ CCU 侧 16 项（传输方式决策、系统格式、输出/返回格式派生查表、HDR、同步 GENLOCK-PTP、网络与 IP、IP Live/NMOS/第三方协议、Web 菜单、CCU 文件与日志、前面板灯语诊断、状态画面判读、DIAGNOSIS 硬件诊断、音频与对讲、干线提示机、本机菜单操作、接口规格环境速查）+ 跨书 2 项（整系统组网与联调、整系统联合排障）。按用户意图路由到对应能力卡执行。'
  core_principles:
  - 数值与格式串零改写：规格、接口、格式串、页码、代码一律原样回报，禁止换算或四舍五入
  - 先定层级再动手：系统级问题先判"面板侧 / 主机侧 / 链路侧"，再进对应能力卡
  - 两端一致性：RCP 与 CCU 的 CNS 模式、CCU 编号、主设备 IP 必须一致且全系统唯一
  - 前置条件链：传输方式 → 系统格式 → 输出/返回格式是派生链，越级设定必然失败
  - 选件门槛先核：菜单项是否存在取决于是否安装 HKCU-SFP50/SDI50/SM50 或 HZCU-UHD35/CNFG50/SNMP50
  - 手册留白诚实转介：多处"请联系 Sony 维修代表或销售代表"，未载内容标注缺口不编造
  - 不可逆操作先警示：改 CNS 需重启所有摄像机系统；改 DATE&TIME 会清空全部日志
  out_of_scope:
  - 摄像机（HDC 系列）自身的维修与固件升级操作
  - 选件板（HKCU-* / HZCU-*）的物理安装步骤（手册明示仅经培训人员可执行）
  - 其他型号遥控面板或 CCU 的专属操作
  - 书摘/读后感/作者人设扮演
  stop_conditions:
  - 用户未提供所连设备型号或选件安装情况，而该信息影响菜单项存在性时，先询问再执行
  - 需要给出手册未载的处置步骤或参数数值时（如 SFP+ 模块兼容清单、电源电压切换方法、CABLE ALARM SHORT 处置），停止并声明缺口
  - 安全关键数值或格式串与手册原文冲突时，以原文为准并停止改写
  - 涉及第 67 页 HFR↔BNC Link 编配表（已知文本提取缺口）时，声明依据不完整
router_entry:
  name: sony-ccu-rcp-system-router
  description: 'Sony 摄像机控制系统技能的来源路由入口：按用户意图（RCP 面板侧 / CCU 主机侧 / 跨两端整系统）从 31 张能力卡中路由到对应能力并执行；未晋级为独立 Skill 的能力全部经此入口可达。'
promotion_budget: 8
capabilities:
- capability_id: cap.rcp-3500.network-setup
  revision: 1
  status: active
  slug: network-setup
  title: 组网连接与配置
  importance: critical
  importance_rationale: 映射 task-01（首次安装选定组网模式并完成连接设定）/task-02（接地判断）——原书任务清单标注 "安装是其余一切的前提；配错需重启全系统"。遗漏后果：模式选错或 IP/RCP 编号重叠导致整系统不通 （ce13/ce14），改 CNS 不重启所有摄像机系统则新旧拓扑混杂（ce07），纯 LAN 不接地有安全风险（ce15）。
  one_liner: 先按物理连线四选一定 CNS（只用 CCA-5→LEGACY；LAN 一对一→BRIDGE；混合拓扑/多机→MCS；HZC-RCP5→PC 控制），配置在工程师模式完成，编号与 IP 全系统唯一，更改 CNS 后必须重启所有摄像机系统。
  intents:
  - 把 RCP 接入摄像机系统并选定组网模式（LEGACY/BRIDGE/MCS/PC 控制）
  - 配置面板 TCP/IP、目标 IP、主设备 IP 与 RCP 编号
  - 判断安装是否需要接地、布线是否合规格
  - 组网变更后按铁律收尾投用（重启所有摄像机系统）
  - 规划 MCS/PC 控制的 IP 编址与编号唯一性
  keywords:
  - 组网
  - 连接模式
  - CNS
  - LEGACY
  - BRIDGE
  - MCS
  - IP 地址
  - RCP 编号
  - 接地
  - CCA-5
  - network setup
  - grounding
  card: cards/network-setup.md
  frontmatter:
    description: '何时用: 新装/搬迁面板接入摄像机系统、选组网模式（LEGACY/BRIDGE/MCS/PC 控制）、配 IP 与

      RCP 编号、判断是否接地、布线检查或组网变更后投用。触发词: 组网、连接、CNS、IP、RCP 编号、

      接地、network setup。何时不用: 控制权仲裁（激活/PARA）用 mcs-operations；

      灯语判读用 led-diagnostics；纯数值速查用 specs-reference。核心: CCA-5→LEGACY，LAN 一对一→

      BRIDGE，混合/多机→MCS；编号 IP 全系统唯一；更改 CNS 后必须重启所有摄像机系统。

      '
    tags:
    - decision
    - procedure
    - network
  source_evidence:
  - source_id: sony-rcp-3500-3501-manual-2019
    location: 第 3-7 页、第 15-20 页
  also_read:
  - mcs-operations
  - engineer-mode-security
  - led-diagnostics
  - specs-reference
  promotion:
    destination: promoted
    gate:
      independent_intent: true
      independent_contract: true
      independent_run: true
      independent_reuse: true
      independent_eval: true
    notes: 安装前提，跨场景复用最高
- capability_id: cap.rcp-3500.mcs-operations
  revision: 1
  status: active
  slug: mcs-operations
  title: MCS 多机操作仲裁
  importance: high
  importance_rationale: 映射 task-15（MCS 多机协同规则：激活/PARA/IRIS-MB/RCP Assign）——原书任务清单标注"多机位演播必备； 主设备断开时强制激活是冷知识"。遗漏后果：主设备断开后全场常规激活失效、无法操作（ce12）； 误按 PARA/误设主从导致并行无效或功能不工作（ce09/ce10）。
  one_liner: 面板能不能动先看灯——PANEL ACTIVE 亮才有整机操作权（全系统仅一台），IRIS/MB ACTIVE 独占光圈/主黑，PARA 是并行通道（IRIS/MB 激活时禁用），主设备断开时长按 PANEL ACTIVE 强制激活。
  intents:
  - 判断"面板能看到值但拧不动"的原因并取得控制权
  - 多面板并行控制同一摄像机（PARA）
  - 独占或切换光圈/主黑电平控制（IRIS/MB ACTIVE）
  - 用 RCP Assign 更换本面板受控摄像机
  - 主设备（MSU/CNA-1）断开后的应急操作（强制激活）
  - 判断主/从白平衡是否可用及冲突归属
  keywords:
  - MCS
  - 多机
  - 面板激活
  - PANEL ACTIVE
  - PARA
  - 并行控制
  - IRIS MB ACTIVE
  - RCP Assign
  - 主设备
  - 强制激活
  - 主从白平衡
  - multi-camera
  card: cards/mcs-operations.md
  frontmatter:
    description: '何时用: MCS 多机系统中面板能看到值但拧不动、多操作员并行控制、光圈/主黑电平抢控制权、主设备

      （MSU/CNA-1）断开后全场无控制权、RCP Assign 换控机位、CNU 旧有连接的主/从白平衡。触发词:

      激活、PANEL ACTIVE、PARA、并行控制、IRIS/MB ACTIVE、RCP Assign、强制激活、panel

      active。何时不用: 配置 MCS 组网用 network-setup；灯语判读用

      led-diagnostics；单机画质控制用 daily-operation。核心: 仅激活面板可操作；主设备断开时长按

      PANEL ACTIVE 强制激活。

      '
    tags:
    - decision
    - procedure
    - multi-camera
  source_evidence:
  - source_id: sony-rcp-3500-3501-manual-2019
    location: 第 7-8 页、第 10 页、第 14-15 页、第 47-49 页
  also_read:
  - network-setup
  - daily-operation
  - white-black-balance
  - customization
  promotion:
    destination: promoted
    gate:
      independent_intent: true
      independent_contract: true
      independent_run: true
      independent_reuse: true
      independent_eval: true
    notes: 多机仲裁意图独立且高频
- capability_id: cap.rcp-3500.led-diagnostics
  revision: 1
  status: active
  slug: led-diagnostics
  title: 指示灯灯语诊断
  importance: critical
  importance_rationale: 映射 task-08（看灯识故障：NETWORK/ALARM/CABLE）/task-03（CAM PW 供电判断）——原书任务清单与 优先级排序均列第一（"排障第一入口；表格型知识易翻错"）。遗漏后果：误判供电/灯语为设备故障导致 误报修或停播（ce08/ce12/ce34），把 LEGACY 正常态与权限态当故障（f11/f12 判读边界）。
  one_liner: 先分层再查表——CAM PW 管电源、NETWORK 管本机与控制设备、CABLE 管摄像机与 CCU 链路、ALARM 管设备错误；状态与含义原样成对判读，报故障前先排除 LEGACY 正常态、权限态与坏点白点。
  intents:
  - 判读指示灯状态含义（CAM PW/NETWORK/ALARM/CABLE）
  - 从面板给摄像机供电/断电并判断供电状态
  - 定位故障层级（电源/网络/链路/设备）
  - 甄别伪故障（LEGACY 正常态、权限态、兼容性、坏点白点）
  - 处理"监视器一直出彩条"类信号输出异常（BARS 优先）
  keywords:
  - 灯语
  - 指示灯
  - NETWORK
  - ALARM
  - CABLE
  - CAM PW
  - 排障
  - 供电
  - 报警
  - 闪烁
  - indicator
  - troubleshooting
  card: cards/led-diagnostics.md
  frontmatter:
    description: '何时用: 面板或系统不对劲的第一入口——指示灯判读（CAM PW/NETWORK/ALARM/CABLE）、摄像机供电

      状态判断、面板拧了没反应的权限态/故障态甄别、亮点白点要不要报修、监视器一直出彩条。触发词:

      灯闪、灯语、指示灯、CAM PW、NETWORK、ALARM、CABLE、报警、连不上、blinking light、no signal。

      何时不用: 改组网配置用 network-setup；取得控制权用 mcs-operations；白点校正操作用

      maintenance-correction。核心: 先分层再查表，状态→含义原样判读，处置按层级转介。

      '
    tags:
    - troubleshooting
    - reference
    - checklist
  source_evidence:
  - source_id: sony-rcp-3500-3501-manual-2019
    location: 第 3 页、第 8 页、第 10 页、第 15 页、第 48 页
  also_read:
  - network-setup
  - environment-care
  - maintenance-correction
  - daily-operation
  - file-backup
  promotion:
    destination: promoted
    gate:
      independent_intent: true
      independent_contract: true
      independent_run: true
      independent_reuse: true
      independent_eval: true
    notes: 排障第一入口，原书优先级第 1
- capability_id: cap.rcp-3500.specs-reference
  revision: 1
  status: active
  slug: specs-reference
  title: 规格与接口速查
  importance: medium
  importance_rationale: 映射 task-16（查规格/电缆长度/接口针脚）——原书任务清单标注"施工与备线依据；数值必须零改写"。 遗漏后果：数值被换算/改写出错导致布线超限或供电不符（p19/p64 边界），按针脚表在 MCS 盲接 Tally 不工作（ce32），双型号混述涉主黑电平设定项找错（ce37）。
  one_liner: 查询→原样回报，禁止换算——规格表/针脚表/电缆长度/线材规格均按原文数值、单位与页码回报，随附 Tally-MCS 禁用与型号差异提示，表中没有的字段答"原书未给"。
  intents:
  - 查整机规格参数（电源/PoE/功耗/温度/质量/机架）
  - 查电缆长度上限与 LAN 线材规格
  - 查 EXT I/O 接口针脚分配与接口选件型号
  - 查电解电容寿命口径（基准工况）
  - 核对既有接入参数是否超规
  keywords:
  - 规格
  - 参数
  - 针脚
  - 针脚分配
  - EXT I/O
  - 电缆长度
  - 电源电压
  - PoE
  - 功耗
  - specs
  - pinout
  - pin assignment
  card: cards/specs-reference.md
  frontmatter:
    description: '何时用: 施工/采购/机架规划/接线时查规格——电源电压、PoE、功耗、温度、质量、电缆长度上限、

      LAN 线材要求、EXT I/O 九针针脚分配、电解电容寿命口径；排障时核对参数是否超规。触发词: 规格、

      参数、针脚、pin、pinout、多少伏、多少米、specs、pin assignment、cable length、power supply。

      何时不用: 拿数值做组网决策用 network-setup；环境红线与保养动作用 environment-care。核心契约:

      查询→原样回报（数值/单位零改写、禁止换算），表中没有的字段答"原书未给"。

      '
    tags:
    - reference
    - lookup
  source_evidence:
  - source_id: sony-rcp-3500-3501-manual-2019
    location: 第 3 页、第 15-16 页、第 55-56 页
  also_read:
  - network-setup
  - environment-care
  promotion:
    destination: router
    gate:
      independent_intent: true
      independent_contract: true
      independent_run: true
      independent_reuse: false
      independent_eval: true
    notes: 查表型，独立复用低
- capability_id: cap.rcp-3500.environment-care
  revision: 1
  status: active
  slug: environment-care
  title: 使用环境与保养红线
  importance: medium
  importance_rationale: 映射 task-17（使用环境红线：冷凝/干扰/寿命/医疗/清洁）——原书任务清单标注"违反导致设备损坏或 健康风险"。遗漏后果：冷凝未消失通电致设备损坏（ce01），干扰医疗设备有人身健康风险（ce04）， 薄纸擦屏划伤涂层（ce02），超基准工况按 5 年排电容更换致提前故障（ce05）。
  one_liner: 环境七红线逐条"触发→动作→后果"——冷凝断电、通信设备建议关机（建议级不升格）、电容约 5 年按工况折减、医疗设备勿近、接网先确认安全、软布清洁、LCD 坏点非故障；使用前确认运行正常。
  intents:
  - 判断冷凝等环境风险并处置
  - 按手册方法清洁触控面板
  - 制定电容更换/维护计划的寿命口径
  - 接入网络前确认网络安全
  - 选址避开医疗设备与电磁干扰源
  - 每日投入使用前确认运行正常
  keywords:
  - 冷凝
  - 清洁
  - 触控面板
  - 电容寿命
  - 电磁干扰
  - 医疗设备
  - 网络安全
  - 坏点
  - 使用环境
  - 保养
  - condensation
  - cleaning
  card: cards/environment-care.md
  frontmatter:
    description: '何时用: 搬运/进场遇温差（冷凝）、安装选址（医疗设备/电磁干扰）、触控屏清洁、维护计划（电容

      寿命口径）、接网前安全确认、每日投用前运行确认。触发词: 冷凝、起雾、清洁、擦屏幕、电容、寿命、

      干扰、手机、起搏器、医疗设备、网络安全、坏点、condensation、cleaning、lifespan、dead pixel。

      何时不用: 灯语排障用 led-diagnostics；组网与接地操作用 network-setup；Shading/RPN 等校正维护用

      maintenance-correction。核心: 七条红线逐条触发→动作→后果，强制/建议/口径三级语气原样保留。

      '
    tags:
