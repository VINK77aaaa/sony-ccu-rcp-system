  - 规划 RCP 面板 + CCU 主机 + 摄像机的整系统连接
  - 核对两端 CNS 模式、CCU 编号与 IP 的一致性
  - 建立选件与两端能力的映射（SFP50/SDI50/SM50/UHD35/CNFG50/SNMP50）
  - 按正确顺序完成整系统投运与验收
