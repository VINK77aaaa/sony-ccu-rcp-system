- capability_id: cap.system.troubleshooting
  revision: 1
  status: active
  slug: system-troubleshooting
  title: 整系统联合排障
  importance: critical
  importance_rationale: 跨书能力，映射 RCP task-08/12 + CCU task-12/13/14 的接缝。两端都有 NETWORK 与 ALARM 灯但判读体系不同（RCP 面板侧 vs CCU 主机侧），单看任一本都会误判；BOOK_OVERVIEW（CCU）§3 亦指出手册只给现象不给处置。合并包的核心增量。
  one_liner: 排障时先把现象归到"面板侧 / 主机侧 / 链路侧"三层：面板侧看 RCP 的 NETWORK/ALARM/CABLE/CAM PW 灯与激活状态，主机侧看 CCU 的 CABLE ALARM/CABLE CONDITION/FAN STOP 灯、状态画面 11 页与错误消息表、DIAGNOSIS 只读诊断，链路侧看两端 GENLOCK/PTP 与格式一致性；两端同名 NETWORK/ALARM 灯含义不同，是最易误判处。
  intents:
  - 面对"系统不通/画面没信号/面板拧不动"先定故障层级
  - 联合判读两端灯语与状态画面
  - 用错误消息表与 DIAGNOSIS 缩小范围
  - 区分面板侧控制权问题与主机侧链路/格式问题
  keywords:
  - 联合排障
  - 系统不通
  - 没信号
  - 灯语对照
  - 故障层级
  - 状态画面
  - 错误消息
  - system troubleshooting
