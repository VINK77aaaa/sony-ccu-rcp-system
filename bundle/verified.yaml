- capability_id: cap.system.integration
  revision: 1
  status: active
  slug: system-integration
  title: 整系统组网与联调
  importance: critical
  importance_rationale: 跨书能力，映射 RCP task-01 + CCU task-01/07 的接缝。BOOK_OVERVIEW（CCU）§3 指出 RCP 手册反复说行为"因所连设备而异"，而 CCU 手册正是那个"所连设备"的完整定义；两端编号/IP/选件的一致性没有任何一本单独给出。合并包的核心增量。
  one_liner: RCP 面板与 CCU 主机是同一系统的两端：面板经 RCP/CNU 接口（CCA-5）连到 CCU 的 RCP/CNU 接口（并取电），两端的 CNS 模式、CCU 编号、主设备 IP 必须一致且全系统唯一；CCU 侧的传输方式与选件决定整系统格式能力；投运须按"改 CNS 重启所有摄像机系统 / 改 IP Live PORT 重启本机"的顺序收尾。
