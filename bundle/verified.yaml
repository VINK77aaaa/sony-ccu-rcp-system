- capability_id: cap.rcp-3500.daily-operation
  revision: 1
  status: active
  slug: daily-operation
  title: 摄像机日常操作（自动调整/光圈/快门/增益/ND-CC 滤镜/测试信号）
  importance: critical
  importance_rationale: 映射 task-04（自动调整, 手册标注"每日/每场景必做"）与 task-05（拍摄中高频画质操作）；漏失后果为直播亮度/白平衡失控, 滤镜许可与 Zoom/Focus 归属误判会产生伪故障报修。
  one_liner: 动任何旋钮前先看灯——控制权灯亮才操作；自动调整看灯语（亮=进行中/灭=完成/闪=已停止）；滤镜灯灭先按上/下按钮夺取许可；监视器异常先查 BARS 优先级与 Zoom/Focus Active。
  intents:
  - 执行/中止 AWB、ABB、LEVEL、SKIN DTL AUTO HUE 自动调整
  - 调节光圈、快门、增益并读懂指示灯
  - 切换 ND/CC 滤镜并夺取控制许可
  - 选择彩条/测试信号输出
  - 判断变焦/对焦控制权归属（面板 vs 机身）
